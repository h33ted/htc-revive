# Builds HtcRevive.apk on every push to main and publishes it as a GitHub release.
#
# Required repository secrets (so every release has the same signature and local CA, and
# installs as an upgrade over the previous one):
#   SIGNING_KEYSTORE_B64  base64 of certs/release.keystore (PKCS12, password/alias "htcrevive")
#   LOCAL_CA_B64          base64 of a tar.gz of certs/ and assets/{ca.pem,ca.hash,server.p12}
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TOOLS: "34.0.0"
  NDK_VERSION: "23.2.8568313"  # r23c, the newest NDK that still targets API 16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 17, build-tools and NDK r23c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-17" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null

      - name: Assemble the tools directory build.sh expects
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          mkdir -p "$RUNNER_TEMP/tools"
          ln -s "$ANDROID_HOME/platforms/android-17/android.jar" "$RUNNER_TEMP/tools/android-17.jar"
          ln -s "$BT/aapt2" "$RUNNER_TEMP/tools/aapt2"
          ln -s "$BT/lib/d8.jar" "$RUNNER_TEMP/tools/r8.jar"
          ln -s "$BT/lib/apksigner.jar" "$RUNNER_TEMP/tools/apksig.jar"

      - name: Restore signing key and local CA
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          LOCAL_CA_B64: ${{ secrets.LOCAL_CA_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$LOCAL_CA_B64" ]; then
            echo "::error::Set the SIGNING_KEYSTORE_B64 and LOCAL_CA_B64 secrets (see the top of this file)."
            exit 1
          fi
          mkdir -p certs
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > certs/release.keystore
          echo "$LOCAL_CA_B64" | base64 -d | tar -xz

      - name: Build native TLS library
        run: cd jni && "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" -j"$(nproc)"

      - name: Build APK
        env:
          TOOLS: ${{ runner.temp }}/tools
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          bash build.sh
          test -f libs/armeabi-v7a/librevivetls.so
          unzip -l HtcRevive.apk | grep -q lib/armeabi-v7a/librevivetls.so

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          gh release create "$TAG" HtcRevive.apk \
            --target "$GITHUB_SHA" \
            --title "HTC Revive $TAG" \
            --generate-notes
